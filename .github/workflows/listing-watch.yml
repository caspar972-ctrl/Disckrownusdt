name: Listing Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: listing-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KROWN_ONLY: ${{ vars.KROWN_ONLY || '0' }}
        run: python monitor.py

      - name: Save seen.json
        if: always()
        run: |
          git config user.name "listing-watch"
          git config user.email "listing-watch@users.noreply.github.com"
          git pull --rebase origin main || true
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git pull --rebase origin main || true
          git push || echo "push skipped"
